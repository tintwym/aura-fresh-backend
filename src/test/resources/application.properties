# Tests use an in-memory H2 datasource for a lightweight Spring Boot smoke test.
DATABASE_URL=

spring.datasource.url=jdbc:h2:mem:aurafresh;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

jwt.secret=test-secret-key-for-jwt-unit-tests-only-32b
jwt.expiration=3600000

stripe.api.key=sk_test_placeholder_for_context_load
stripe.webhook.secret=

app.frontend.base-url=http://localhost:3000
app.checkout.success-url=
app.checkout.cancel-url=
